  离了谷歌翻译还有谁能逗我笑😁
  <br/>
  <br/>
  为什么会被翻译成○○时间呢？
  <br/>
  其实并不难理解。「ブッ込み」(bukkomi) 的字面意思是「强行塞入」，有一些黄片可能用这个词来代指○○，而这些黄片又恰好被拿来充当谷歌机器翻译模型的训练语料（是的，谷歌翻译看过片）。再加上原文使用了非正式的片假名，使翻译模型 以为其就是用于代指○○的，最终导致「ブッ込み」的误译。
  <br/>
  <br/>
  实际上，「ブッ込み」是一个典型的骑手俚语，意为「猛冲」「冲锋入场」，完全不是那个*奇怪*的意思……
