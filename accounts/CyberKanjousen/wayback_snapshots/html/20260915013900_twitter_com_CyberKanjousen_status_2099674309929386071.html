  <div class="tweet-content">
  这张图片以「没有红色却能看到红色」著称。
  <br/>
  <br/>
  正常的避免看到红色的方法，是眼睛靠近图片，或者放大图片的饮料罐部分。
  <br/>
  <br/>
  但实际上还有一种方法：用手指遮住饮料罐「Coca Cola」的 LOGO 部分，这时候也是看不到红色的。
  <br/>
  <br/>
  也就是说，你之所以能看到红色，除了因为图片背景以外，还是因为可乐罐本身就是红 色的。「可乐罐是红色」这个常识已经在大脑根深蒂固，所以在看到这张图片的时候才补全了红色：
  <img class="tweet-image" src="../image/20260915013900_pbs.twimg.com_media_HSMTquzXEAA7fbz.jpg"/>
