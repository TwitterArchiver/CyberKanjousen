  <div class="tweet-content">
  初中时看过一句话，「如果搞题海战术就能考上好大学的话，那还要老师干什么？」
  <br/>
  但题海战术加 AI 的话，说不定真的可以替代老师，现在的環状線认为。（当然環状線说的是对于应试教育而言）
  <br/>
  AI 不会情绪化，正确率高，有耐心反复讲解，这已经远远超过绝大多数人类老师了。
  <br/>
  但问题是，AI 不会强迫環状線学习，如果環状線不想学习注意力差而且三天打鱼两天晒网的话 AI 绝对拿環状線没办法。人类老师在一定程度上可以通过施加外部压力迫使環状線学习，这或许也是人类老师不易被 AI 取代的原因之一。
  <br/>
  不过如果一个人学习只靠外部压力驱动的话，他真的有可能成功吗？
