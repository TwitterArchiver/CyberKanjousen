  環状線提醒：
  <br/>
  猫猫再可爱，也不要吸吮猫脚哦🥵
  <br/>
  <br/>
  猫猫平时会踩猫砂、在地板上行走，爪子上容易残留猫砂尘土、猫屎残渣以及多种细菌（如大肠杆菌、沙门氏菌等）。
  <br/>
  直接将猫爪含在嘴里，相当于把这些肉眼看不见的脏东西（当然猫屎也包括在内）和微生物直接吃进消化道。有害菌刺激胃肠黏膜， 从而引起急性肠胃炎，出现拉肚子、呕吐等不良反应。
  <br/>
  <br/>
  另外，切勿听信「吸吮猫脚可以让猫猫变猫娘」的谣言。无论你再怎么吸吮猫脚，猫猫还是猫猫，是不可能变成猫娘的！😔
