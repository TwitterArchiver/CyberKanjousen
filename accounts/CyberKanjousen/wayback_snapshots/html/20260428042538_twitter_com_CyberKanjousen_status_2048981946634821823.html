  两名大洋国思想警察走进他的家门。
  <br/>
  <br/>
  「你今天没有参与集体活动。」其中一人平静地说。
  <br/>
  <br/>
  他张了张嘴，却没有解释的欲望。解释什么呢？说自己只是累了？还是说自己什么也没想？
  <br/>
  <br/>
  「你最近的行为，」另一人接着说，「表现出明显的『躺平』倾向。是不是和境外分子有勾连？是不是境外势力指使的？」
  <br/>
  <br/>
  房间里很安静，除了窗外还在机械地重复着口号的广播声。
  <br/>
  <br/>
  他们没有再多说什么。
  <br/>
  <br/>
  他被带走的时候，甚至没有反抗。楼道里有人开门看了一眼，又立刻关上。没有人出声，就像什么都没发生。
  <br/>
  <br/>
  第二天，这栋楼的住户名册上，已经没有他的名字了。
