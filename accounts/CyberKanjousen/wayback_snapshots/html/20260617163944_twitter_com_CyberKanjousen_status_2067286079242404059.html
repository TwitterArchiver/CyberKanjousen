  環状線这个账号唯一一次被封禁，是在刚注册的时候（去年 5 月）被要求验证邮箱地址，因为是用 Apple 账户注册的。那之后一次也没有被封禁过。
  <br/>
  <br/>
  今年 1 月份至目前，環状線没被 Shadowban 过。環状線流量低时（包括 4 月 21 日晚账号刚从停用状态恢复的之后三天），多次以为自己被 Shadowban 了，但一查才发现实际上并没有。
  <br/>
  <br/>
  这样看来，環状線算是相当幸运的了。不过，環状線的 IP 一直都比较干净，而且发布的推文应该都没有违反推特规则，所以没有遭到限制或许只是正常现象……
