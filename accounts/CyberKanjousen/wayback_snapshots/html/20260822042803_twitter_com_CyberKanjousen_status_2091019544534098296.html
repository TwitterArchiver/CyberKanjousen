  Vivo 手机不要命了这是😨
  <br/>
  <br/>
  原理：
  <br/>
  国产手机厂商的应用商店，当搜索词未匹配到精准的应用名称或关键词时，会降级推荐下载量极高、活跃度大的「头部热门应用」。
  <br/>
  <br/>
  但是，比小红书活跃度高的应用比比皆是，为什么偏偏是小红书？这其实还和竞价广告与热门词覆盖有关。
  <br/>
  <br/>
  部分应用在投放应用商店广告时，会购买或覆盖极宽泛的搜索关键词包（哪怕词包里含有侮辱性词汇）。只要用户产生搜索行为，广告算法就会优先展示推广效果最佳的常规爆款应用。
  <br/>
  <br/>
  也就是说，小红书在 Vivo 应用商店购买的关键词包很可能含有这种侮辱性词汇，这才闹出了搜「婊子窝」推荐小红书的笑话……
