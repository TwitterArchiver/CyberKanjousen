  月球虽然没有参加世界杯，但是世界杯处处都能感觉到月球带来的影响——
  <br/>
  <br/>
  没有月球的引力，地球自转会乱套，球员拼抢，进球都大受影响；
  <br/>
  没有月球的潮汐，球场草皮会干死，球员只能在糟糕的草皮上踢球里踢。
  <br/>
  <br/>
  没有月球的引力，地球潮汐不会存在；没有潮汐，很多沿海城市的港口不会形成；没有港口，很多球 迷买不到啤酒；没有啤酒，世界杯气氛就少了一半。
  <br/>
  <br/>
  有些影响力就是这样，不需要参赛，不需要进球，甚至不用出现在名单里，只要事后回顾一下，就能发现——原来整个世界杯都离不开它。
