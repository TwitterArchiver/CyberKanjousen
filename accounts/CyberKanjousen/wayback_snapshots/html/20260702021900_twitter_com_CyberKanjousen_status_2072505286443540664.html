  依例提醒准大学生：
  <br/>
  不要轻信视频中这类「代肝兼职」招聘广告，在游戏聊天内向你私信此类消息的，遇到一个就拉黑并举报一个。
  <br/>
  <br/>
  这种在招聘时会向你收几百块钱，他们会说「满足条件即可退回」，但等你满足条件以后，他们会拼了命地找借口拖延时间，就是不把钱还给你。 而且工作强度极大，给的工资少得可怜，简直就是在给工作室当黑奴。
  <br/>
  <br/>
  環状線在去年暑假时也遇到了一个，当时要求交钱的时候環状線有些怀疑，在 Bilibili 一查才发现是彻头彻尾的骗局。
  <br/>
  <br/>
  遇到这种消息，还请各位推友尤其准大学生务必保持警惕。
  <br/>
